name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: validate tag, build, and test
        run: |
          node -e 'import("./scripts/package.mjs").then(({ isReleaseTag }) => { if (!isReleaseTag(process.env.GITHUB_REF_NAME)) throw new Error("Invalid SemVer tag: " + process.env.GITHUB_REF_NAME) })'
          npm ci
          npm run build
          node --test
      - name: package and smoke-test the extracted archive
        run: |
          node scripts/package.mjs "$GITHUB_REF_NAME" --output release
          (cd release && sha256sum -c "homeport-$GITHUB_REF_NAME.sha256")
      - uses: actions/setup-node@v4
        with:
          node-version: 20.6.1
      - name: smoke-test the packaged Node 20.6 runtime
        run: node scripts/release-smoke.mjs "release/homeport-$GITHUB_REF_NAME.tar.gz"
      - name: retain release artifacts for publication
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: build and run platform tests
        run: |
          npm ci
          npm run build
          node --test
      - name: validate PowerShell installers without installing
        shell: powershell
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'tray/homeport-tray.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; exit 1 }
          }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: build the native companion
        working-directory: macos
        # Universal binary: the runner is ARM64, but Intel Macs download it too.
        env:
          SWIFT_BUILD_FLAGS: --arch arm64 --arch x86_64
        run: |
          swift test
          ./build.sh
          test -x dist/Homeport.app/Contents/MacOS/Homeport
          lipo dist/Homeport.app/Contents/MacOS/Homeport -verify_arch arm64 x86_64
      - name: zip the ad-hoc-signed app
        working-directory: macos
        run: |
          mkdir -p ../release
          ditto -c -k --keepParent dist/Homeport.app "../release/Homeport-$GITHUB_REF_NAME-macos.zip"
      - name: retain the macOS app for publication
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: release/
          if-no-files-found: error

  publish:
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: release
      - name: publish GitHub release after every gate passes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Every release stays a pre-release until signed builds land (#34).
        run: |
          notes="The macOS app (Homeport-$GITHUB_REF_NAME-macos.zip) is unsigned (ad-hoc signature only), so macOS blocks its first launch. Open it once, then choose System Settings → Privacy & Security → Open Anyway, or run \`xattr -dr com.apple.quarantine /Applications/Homeport.app\`. Signed and notarized builds are tracked in #34."
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GH_REPO" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes
