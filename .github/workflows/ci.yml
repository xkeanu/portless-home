name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install contributor dependencies
        run: npm ci
      - name: build and test
        run: |
          npm run build
          node --test
      - name: syntax checks
        run: |
          node --check server.mjs
          node --check render.mjs
          node --check peers.mjs
          node --check menubar.mjs
          node --check i18n.mjs
          node --check live.mjs
          node --check launch.mjs
          node --check external.mjs
          node --check dist/ui-server.mjs
          bash -n install.sh
          bash -n uninstall.sh
          sh -n menubar/portless-home.15s.sh
          ruby -c Formula/portless-home.rb
          ruby -c Formula/portless-home-app.rb
          sh -n macos/build.sh
      - name: powershell syntax checks
        shell: pwsh
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'tray/portless-home-tray.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; exit 1 }
          }
      - name: smoke test
        run: |
          mkdir -p ~/.portless
          printf '[{"hostname":"demo.localhost","pid":%d,"tailscaleUrl":"https://mac.tailnet.ts.net:8443"},{"hostname":"dead.localhost","pid":4194305}]' $$ > ~/.portless/routes.json
          printf '{"apps":[{"label":"External CI fixture","url":"https://external-ci.example.ts.net:8443/path"}]}\n' > "$RUNNER_TEMP/portless-home-external-apps.json"
          PORTLESS_EXTERNAL_APPS="$RUNNER_TEMP/portless-home-external-apps.json" node server.mjs &
          sleep 1
          page=$(curl -sf http://127.0.0.1:5995)
          echo "$page" | grep -q 'demo' || { echo "missing app link"; exit 1; }
          echo "$page" | grep -Fq 'href="https://external-ci.example.ts.net:8443/path"' || { echo "missing external app link"; exit 1; }
          if echo "$page" | grep -q 'dead'; then echo "dead-pid app not filtered"; exit 1; fi
          node scripts/package.mjs v0.0.0-ci --output .release
      - uses: actions/setup-node@v4
        with:
          node-version: 20.6.1
      - name: packaged Node 20.6 runtime smoke test
        run: |
          node scripts/release-smoke.mjs .release/portless-home-v0.0.0-ci.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: build and test
        run: |
          npm ci
          npm run build
          node --test
      # Windows PowerShell 5.1 (`powershell`), the one every Windows box has.
      - name: install, tray, uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\install.ps1 -NoAutostart
          if ($LASTEXITCODE) {
            Get-ScheduledTaskInfo portless-home | Format-List LastRunTime, LastTaskResult
            $dir = "$env:USERPROFILE\.portless-home"
            Start-Process node -ArgumentList "--env-file=$dir\service.env", "$dir\server.mjs" -NoNewWindow -RedirectStandardError server-err.txt
            Start-Sleep -Seconds 3
            Get-Content server-err.txt
            exit 1
          }
          if ((Get-ScheduledTask portless-home).Triggers.Count) { throw '-NoAutostart registered a logon trigger' }
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5995/api/menubar).Content
          $installDir = "$env:USERPROFILE\.portless-home"
          foreach ($file in 'external.mjs', 'dist\ui-server.mjs', 'dist\ui.js', 'dist\ui.css') {
            if (-not (Test-Path "$installDir\$file")) { throw "installed asset missing: $file" }
          }
          $settings = Get-Content "$installDir\service.env"
          if ($settings -notcontains "PORTLESS_APPS=$installDir\apps.json") { throw 'registry path missing from service.env' }
          if ($settings -notcontains "PORTLESS_EXTERNAL_APPS=$installDir\external-apps.json") { throw 'external app config path missing from service.env' }
          $registry = @{ enabled = $true; apps = @(@{ hostname = 'fixture.localhost'; cwd = $installDir; command = 'node --version' }) } | ConvertTo-Json -Depth 3
          [IO.File]::WriteAllText("$installDir\apps.json", $registry)
          $external = @{ apps = @(@{ label = 'External CI fixture'; url = 'https://external-ci.example.ts.net:8443/path' }) } | ConvertTo-Json -Depth 3
          [IO.File]::WriteAllText("$installDir\external-apps.json", $external)
          $page = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5995/).Content
          if (-not $page.Contains('data-start="fixture.localhost"')) { throw 'installed service did not read the local registry' }
          if (-not $page.Contains('href="https://external-ci.example.ts.net:8443/path"')) { throw 'installed service did not read the external app config' }
          foreach ($asset in 'assets/ui.js', 'assets/ui.css') {
            if ((Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:5995/$asset").StatusCode -ne 200) { throw "missing $asset" }
          }
          $tray = Start-Process powershell -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', 'tray\portless-home-tray.ps1' -PassThru
          Start-Sleep -Seconds 8
          if ($tray.HasExited) { throw "tray exited with $($tray.ExitCode)" }
          Stop-Process $tray
          .\uninstall.ps1
          if (Get-ScheduledTask portless-home -ErrorAction SilentlyContinue) { throw 'task not removed' }
          if (Test-Path "$env:USERPROFILE\.portless-home") { throw 'install dir not removed' }

  macos-app:
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: tests
        run: swift test
      - name: bundle
        run: ./build.sh && test -x dist/PortlessHome.app/Contents/MacOS/PortlessHome
